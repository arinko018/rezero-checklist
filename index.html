<body>
<div id="app">
  <header>
    <div class="header-top">
      <button id="lang-toggle" onclick="toggleLang()">🇺🇸 EN</button>
    </div>
    <h1 id="site-title">✨ Re:ゼロから始める異世界生活 ✨</h1>
    <p class="subtitle">Total Checklist — Lost in Memories Style 💜</p>
    <p class="update-date"><span id="update-label">最終更新日：</span><span id="update-date-val">2026年06月02日</span></p>
  </header>

  <div class="global-progress">
    <div class="gp-label">
      <span>🌟 <span id="gp-label-text">総合達成率</span></span>
      <span class="gp-count"><span id="global-done">0</span> / <span id="global-total">0</span></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="global-bar" style="width:0%"></div></div>
  </div>

  <div class="action-row">
    <button class="btn btn-x" id="btn-share-x" onclick="shareToX()">𝕏 Xでシェア</button>
    <button class="btn btn-copy" id="btn-copy-url" onclick="copyURL()">🔗 URLをコピー</button>
    <button class="btn btn-reset" id="btn-reset" onclick="resetAll()">🗑️ リセット</button>
  </div>

  <div class="tabs" id="tab-bar"></div>
  <div id="panels"></div>
</div>

<div id="toast"></div>

<!-- Share Modal -->
<div id="share-modal-overlay">
  <div id="share-modal">
    <button id="share-modal-close" onclick="closeShareModal()">×</button>
    <h2 id="modal-title">📤 シェア画像</h2>

let currentLang = localStorage.getItem('rezero_lang') || 'ja';

function toggleLang() {
  currentLang = currentLang === 'ja' ? 'en' : 'ja';
  localStorage.setItem('rezero_lang', currentLang);
  applyLang();
  buildUI();
}

function applyLang() {
  const L = LANG[currentLang];
  // lang toggle button
  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) langBtn.textContent = currentLang === 'ja' ? '🇺🇸 EN' : '🇯🇵 JP';
  // header
  const siteTitleEl = document.getElementById('site-title');
  if (siteTitleEl) siteTitleEl.textContent = '✨ ' + L.siteTitle + ' ✨';
  // update label
  const ulEl = document.getElementById('update-label');
  if (ulEl) ulEl.textContent = L.updateLabel;
  // global progress
  const gpEl = document.getElementById('gp-label-text');
  if (gpEl) gpEl.textContent = L.globalProgress;
  // action buttons
  const btnX = document.getElementById('btn-share-x');
  if (btnX) btnX.textContent = L.shareX;
  const btnCopy = document.getElementById('btn-copy-url');
  if (btnCopy) btnCopy.textContent = L.copyUrl;
  const btnReset = document.getElementById('btn-reset');
  if (btnReset) btnReset.textContent = currentLang === 'en' ? '🗑️ Reset' : '🗑️ リセット';
  // modal
  const mtEl = document.getElementById('modal-title');
  if (mtEl) mtEl.textContent = '📤 ' + L.modalTitle;
  const dlEl = document.getElementById('modal-btn-dl');
  if (dlEl) dlEl.textContent = L.downloadBtn;
  const xpostEl = document.getElementById('share-modal-xbtn');
  if (xpostEl) xpostEl.textContent = L.postX;
}

let checked = new Set();

function getAllIds() {
  const ids = [];
  for (const t of TABS) for (const s of t.sections) for (const i of s.items) ids.push(i.id);
  return ids;
}

function encodeState() {
  const allIds = getAllIds();
  const bits = allIds.map(id => checked.has(id) ? '1' : '0').join('');
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8)
    bytes.push(parseInt(bits.slice(i, i + 8).padEnd(8, '0'), 2));
  return btoa(String.fromCharCode(...bytes));
}

function decodeState(hash) {
  try {
    const bytes = atob(hash).split('').map(c => c.charCodeAt(0));
    const bits = bytes.map(b => b.toString(2).padStart(8, '0')).join('');
    getAllIds().forEach((id, i) => { if (bits[i] === '1') checked.add(id); });
  } catch(e) {}
}

function saveState() {
  history.replaceState(null, '', '#' + encodeState());
}

function buildUI() {
  const tabBar = document.getElementById('tab-bar');
  const panels = document.getElementById('panels');
  tabBar.innerHTML = '';
  panels.innerHTML = '';

  const L = LANG[currentLang];
  TABS.forEach((tab, ti) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (ti === 0 ? ' active' : '');
    btn.textContent = L.tabs[tab.id] || tab.id;
    btn.dataset.tab = tab.id;
    btn.onclick = () => switchTab(tab.id);
    tabBar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (ti === 0 ? ' active' : '');
    panel.id = 'panel-' + tab.id;

    tab.sections.forEach(sec => {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.id = 'sec-' + sec.id;

      const hdr = document.createElement('div');
      hdr.className = 'section-header';

      const titleEl = document.createElement('div');
      titleEl.className = 'section-title';
      const secTitleText = typeof sec.title === 'object' ? sec.title[currentLang] : sec.title;
      titleEl.innerHTML = sec.icon + ' ' + secTitleText;

      const ctrl = document.createElement('div');
      ctrl.className = 'section-controls';

      const progText = document.createElement('span');
      progText.className = 'section-progress-text';
      progText.id = 'prog-' + sec.id;

      const btnAll = document.createElement('button');
      btnAll.className = 'btn-small';
      btnAll.textContent = L.checkAll;
      btnAll.onclick = (e) => { e.stopPropagation(); toggleAll(sec, true); };

      const btnNone = document.createElement('button');
      btnNone.className = 'btn-small';
      btnNone.textContent = L.uncheckAll;
      btnNone.onclick = (e) => { e.stopPropagation(); toggleAll(sec, false); };

      ctrl.append(progText, btnAll, btnNone);
      hdr.append(titleEl, ctrl);

      const body = document.createElement('div');
      body.className = 'section-body';

      const barWrap = document.createElement('div');
      barWrap.className = 'section-bar';
      const barFill = document.createElement('div');
      barFill.className = 'section-bar-fill';
      barFill.id = 'bar-' + sec.id;
      barFill.style.width = '0%';
      barWrap.appendChild(barFill);

      const ul = document.createElement('ul');
      ul.className = 'check-list';

      sec.items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'check-item' + (checked.has(item.id) ? ' checked' : '');
        li.dataset.id = item.id;
        li.onclick = () => toggleItem(item.id);

        const box = document.createElement('div');
        box.className = 'check-box';
        box.textContent = checked.has(item.id) ? '★' : '';

        const wrap = document.createElement('div');
        const lbl = document.createElement('span');
        lbl.className = 'check-label';
        lbl.textContent = item.label;
        wrap.appendChild(lbl);
        if (item.sub) {
          const sub = document.createElement('span');
          sub.className = 'check-sublabel';
          sub.textContent = item.sub;
          wrap.appendChild(sub);
        }

        li.append(box, wrap);
        ul.appendChild(li);
      });

      body.append(barWrap, ul);
      card.append(hdr, body);
      panel.appendChild(card);
    });

    panels.appendChild(panel);
  });

  updateAllProgress();
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
}

function toggleItem(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  const li = document.querySelector('.check-item[data-id="' + id + '"]');
  if (li) {
    li.classList.toggle('checked', checked.has(id));
    li.querySelector('.check-box').textContent = checked.has(id) ? '★' : '';
  }
  updateAllProgress();
  saveState();
}

function toggleAll(sec, val) {
  sec.items.forEach(item => {
    if (val) checked.add(item.id); else checked.delete(item.id);
    const li = document.querySelector('.check-item[data-id="' + item.id + '"]');
    if (li) {
      li.classList.toggle('checked', val);
      li.querySelector('.check-box').textContent = val ? '★' : '';
    }
  });
  updateAllProgress();
  saveState();
}

function updateAllProgress() {
  let gDone = 0, gTotal = 0;
  for (const tab of TABS) {
    for (const sec of tab.sections) {
      const total = sec.items.length;
      const done = sec.items.filter(i => checked.has(i.id)).length;
      gDone += done; gTotal += total;
      const pct = total ? Math.round(done / total * 100) : 0;
      const pe = document.getElementById('prog-' + sec.id);
      const be = document.getElementById('bar-' + sec.id);
      if (pe) pe.textContent = done + ' / ' + total + ' (' + pct + '%)';
      if (be) be.style.width = pct + '%';
    }
  }
  document.getElementById('global-done').textContent = gDone;
  document.getElementById('global-total').textContent = gTotal;
  const gpct = gTotal ? Math.round(gDone / gTotal * 100) : 0;
  document.getElementById('global-bar').style.width = gpct + '%';
}

// カテゴリ別達成率を計算
function getCategoryStats() {
  const L = LANG[currentLang];
  const categoryMap = [
    ['novel', L.categoryLabels.novel],
    ['web', L.categoryLabels.web],
    ['ex', L.categoryLabels.ex],
    ['short', L.categoryLabels.short],
    ['anime', L.categoryLabels.anime],
    ['game', L.categoryLabels.game],
  ];
  const result = [];
  for (const [tabId, label] of categoryMap) {
    const tab = TABS.find(t => t.id === tabId);
    if (!tab) continue;
    let total = 0, done = 0;
    for (const sec of tab.sections) {
      for (const item of sec.items) {
        total++;
        if (checked.has(item.id)) done++;
      }
    }
    result.push({ label: label, done, total, pct: total ? Math.round(done / total * 100) : 0 });
  }
  return result;
}

function generateShareCanvas() {
  const canvas = document.getElementById('share-canvas');
  const W = 1200, H = 630;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // ── 背景：ラベンダーグラデーション ──
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#e2ccf5');
  bg.addColorStop(0.5, '#edd8fa');
  bg.addColorStop(1, '#f5e2f8');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── ドット柄オーバーレイ ──
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let row = 0; row < 20; row++) {
    for (let col = 0; col < 30; col++) {
      ctx.beginPath();
      ctx.arc(col * 44 + (row % 2 === 0 ? 0 : 22), row * 36, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ── オレンジ斜線（太いリボン）──
  function drawStripe(ctx, x1, y1, x2, y2, width, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }
  // オレンジリボン群（左下→右上）
  drawStripe(ctx, -80, 520, 480, -80, 130, 'rgba(255,160,50,0.75)');
  drawStripe(ctx, 60, 650, 600, 40, 70, 'rgba(255,140,30,0.55)');
  drawStripe(ctx, 200, 680, 700, 80, 40, 'rgba(255,170,60,0.4)');
  // 右上オレンジ
  drawStripe(ctx, 700, -50, 1300, 400, 120, 'rgba(255,160,50,0.65)');
  drawStripe(ctx, 850, -80, 1350, 350, 60, 'rgba(255,145,35,0.45)');

  // ── 紫アクセント斜線 ──
  drawStripe(ctx, -50, 380, 300, -50, 55, 'rgba(160,80,230,0.45)');
  drawStripe(ctx, 1000, 680, 1300, 200, 80, 'rgba(140,70,210,0.38)');

  // ── 白い4pointed星（スパークル）──
  function draw4Star(ctx, cx, cy, size, alpha) {
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.shadowBlur = size * 1.5;
    ctx.shadowColor = `rgba(255,255,255,${alpha * 0.8})`;
    ctx.translate(cx, cy);
    const arms = 4;
    ctx.beginPath();
    for (let i = 0; i < arms * 2; i++) {
      const ang = (Math.PI * 2 / (arms * 2)) * i - Math.PI / 2;
      const r = i % 2 === 0 ? size : size * 0.15;
      if (i === 0) ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
      else ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  const stars = [
    [490, 60, 38, 0.95], [300, 140, 22, 0.85], [600, 30, 16, 0.8],
    [80, 200, 28, 0.9], [150, 80, 14, 0.75], [1060, 80, 32, 0.9],
    [920, 170, 18, 0.8], [1140, 250, 24, 0.85], [50, 450, 20, 0.8],
    [1080, 520, 30, 0.9], [700, 580, 16, 0.75], [380, 570, 20, 0.8],
    [820, 40, 14, 0.7], [180, 540, 12, 0.7],
  ];
  stars.forEach(([x, y, s, a]) => draw4Star(ctx, x, y, s, a));

  // ── 中央白カード ──
  const cX = W / 2, cY = H / 2 + 20;
  const cW = 820, cH = 420;
  ctx.save();
  ctx.shadowBlur = 40;
  ctx.shadowColor = 'rgba(160,80,230,0.2)';
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.beginPath();
  ctx.roundRect(cX - cW/2, cY - cH/2, cW, cH, 28);
  ctx.fill();
  ctx.restore();

  // カード縁
  ctx.save();
  ctx.strokeStyle = 'rgba(200,160,240,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(cX - cW/2, cY - cH/2, cW, cH, 28);
  ctx.stroke();
  ctx.restore();

  // ── 上部タイトルエリア ──
  // 「リゼロ」大文字
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 82px "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';
  // 白縁取り
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 10;
  ctx.lineJoin = 'round';
  ctx.strokeText('リゼロ', cX, 120);
  // 紫文字
  const tGrad = ctx.createLinearGradient(cX - 200, 60, cX + 200, 130);
  tGrad.addColorStop(0, '#a040e0');
  tGrad.addColorStop(1, '#7020b0');
  ctx.fillStyle = tGrad;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(160,60,220,0.4)';
  ctx.fillText('リゼロ', cX, 120);
  ctx.restore();

  // サブタイトル
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 17px "Hiragino Sans", sans-serif';
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.strokeText('-STARTING LIFE IN ANOTHER WORLD-', cX, 152);
  ctx.fillStyle = '#8020c0';
  ctx.fillText('-STARTING LIFE IN ANOTHER WORLD-', cX, 152);
  ctx.restore();

  // ── 達成率 ──
  const done  = parseInt(document.getElementById('global-done').textContent)  || 0;
  const total = parseInt(document.getElementById('global-total').textContent) || 0;
  const pct   = total ? Math.round(done / total * 100) : 0;

  // 「コンプリート率」ラベル
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '20px "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#9030d0';
  ctx.fillText(currentLang === 'en' ? 'Completion Rate' : 'コンプリート率', cX, cY - 130);
  ctx.restore();

  // 大きな % 数字
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 110px "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", sans-serif';
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 12;
  ctx.lineJoin = 'round';
  ctx.strokeText(pct + '%', cX, cY - 20);
  const pGrad = ctx.createLinearGradient(cX - 100, cY - 130, cX + 100, cY - 20);
  pGrad.addColorStop(0, '#c060f0');
  pGrad.addColorStop(0.5, '#9030d0');
  pGrad.addColorStop(1, '#6010a0');
  ctx.fillStyle = pGrad;
  ctx.shadowBlur = 20;
  ctx.shadowColor = 'rgba(160,60,220,0.35)';
  ctx.fillText(pct + '%', cX, cY - 20);
  ctx.restore();

  // 達成数
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#8028b8';
  ctx.fillText('★ ' + done + ' / ' + total + (currentLang === 'en' ? ' items' : ' 項目達成') + ' ★', cX, cY + 20);
  ctx.restore();

  // ── カテゴリ別バー ──
  const cats = getCategoryStats();
  const cols = 2;
  const rows = Math.ceil(cats.length / cols);
  const bTop = cY + 45;
  const bH = 16;
  const colWide = (cW - 60) / cols;
  const barColors = ['#c060f0','#f06090','#60b0f0','#f09030','#60d090','#f060c0','#9090f0'];

  cats.forEach((cat, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const xBase = cX - cW/2 + 30 + col * colWide;
    const yBase = bTop + row * (bH + 22) + bH;
    const bW = colWide - 20;
    const color = barColors[i % barColors.length];

    // ラベル
    ctx.save();
    ctx.fillStyle = '#6a1b9a';
    ctx.font = '13px "Hiragino Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(cat.label, xBase, yBase - 3);
    // %
    ctx.textAlign = 'right';
    ctx.font = 'bold 13px "Hiragino Sans", sans-serif';
    ctx.fillStyle = '#9030d0';
    ctx.fillText(cat.pct + '%', xBase + bW, yBase - 3);
    ctx.restore();

    // バー背景
    ctx.fillStyle = 'rgba(200,160,230,0.25)';
    ctx.beginPath();
    ctx.roundRect(xBase, yBase + 1, bW, bH, bH/2);
    ctx.fill();

    // バー
    if (cat.pct > 0) {
      const fw = Math.max(bW * cat.pct / 100, bH);
      const bg2 = ctx.createLinearGradient(xBase, 0, xBase + fw, 0);
      bg2.addColorStop(0, color + 'bb');
      bg2.addColorStop(1, color + '77');
      ctx.save();
      ctx.fillStyle = bg2;
      ctx.shadowBlur = 6;
      ctx.shadowColor = color + '66';
      ctx.beginPath();
      ctx.roundRect(xBase, yBase + 1, fw, bH, bH/2);
      ctx.fill();
      ctx.restore();
    }
  });

  // ── 下部：URL＋ハッシュタグ ──
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '13px sans-serif';
  ctx.fillStyle = 'rgba(120,60,180,0.65)';
  const shortUrl = location.href.length > 55 ? location.href.slice(0, 52) + '...' : location.href;
  ctx.fillText('🔗 ' + shortUrl + '  #リゼロ #rezero', cX, H - 18);
  ctx.restore();

  return canvas;
}
function shareToX() {
  const canvas = generateShareCanvas();
  const preview = document.getElementById('share-canvas-preview');
  preview.src = canvas.toDataURL('image/png');

  const done  = document.getElementById('global-done').textContent;
  const total = document.getElementById('global-total').textContent;
  const pct   = total > 0 ? Math.round(parseInt(done) / parseInt(total) * 100) : 0;
  const tweetBody = currentLang === 'en'
    ? 'Re:Zero Checklist ' + pct + '% complete (' + done + '/' + total + ')\n'
    : 'リゼロ既読チェック ' + pct + '%達成（' + done + '/' + total + '）\n';
  const tweetText = tweetBody + location.href + '\n#リゼロ #rezero';

  // ダウンロードボタン
  const dlBtn = document.getElementById('modal-btn-dl');
  if (dlBtn) {
    dlBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'rezero_checklist.png';
      a.click();
    };
  }

  // Xで投稿ボタン（モバイル: Web Share API / デスクトップ: 画像DL+X intent）
  const xBtn = document.getElementById('share-modal-xbtn');
  if (xBtn) {
    xBtn.onclick = async () => {
      // モバイルでWeb Share API（ファイル共有）を試みる
      canvas.toBlob(async (blob) => {
        const file = new File([blob], 'rezero_checklist.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], text: tweetText, title: 'リゼロ既読チェックリスト' });
            return;
          } catch (e) { /* fallthrough */ }
        }
        // フォールバック：画像DL + クリップボードコピー + X を開く
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'rezero_checklist.png';
        a.click();
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(tweetText).catch(() => {});
        }
        setTimeout(() => {
          window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(tweetText), '_blank');
          showToast(currentLang === 'en'
            ? '📥 Image downloaded! Attach it to your tweet ✨'
            : '📥 画像をダウンロードしました！ツイートに添付してください ✨');
        }, 600);
      });
    };
  }

  document.getElementById('share-modal-overlay').classList.add('open');
}
function closeShareModal() {
  document.getElementById('share-modal-overlay').classList.remove('open');
}

function downloadShareImage() {
  const canvas = document.getElementById('share-canvas');
  const a = document.createElement('a');
  a.download = 'rezero_checklist.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// モーダル外クリックで閉じる
document.getElementById('share-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeShareModal();
});

function resetAll() {
  const msg = currentLang === 'en'
    ? 'Reset all checks? This cannot be undone.'
    : '全てのチェックをリセットしますか？\nこの操作は元に戻せません。';
  if (!confirm(msg)) return;
  checked.clear();
  saveToUrl();
  updateAll();
  showToast(currentLang === 'en' ? 'Reset complete ✨' : 'リセットしました ✨');
}

function copyURL() {
  const href = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(href).then(() => showToast(LANG[currentLang].copiedMsg + ' ✨'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = href;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(LANG[currentLang].copiedMsg + ' ✨');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// INIT
if (location.hash && location.hash.length > 1) {
  decodeState(location.hash.slice(1));
}
applyLang();
buildUI();
